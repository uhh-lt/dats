clip:
  text_encoder:
    model: "sentence-transformers/clip-ViT-B-32-multilingual-v1"
    batch_size: 128
    device: cuda
  image_encoder:
    model: "clip-ViT-B-32"
    batch_size: 64
    device: cuda
  deployment:
    api:
      name: "clip"
      num_replicas: 1
      max_ongoing_requests: 128
    model_worker:
      max_ongoing_requests: 64
      gpu_memory_gb: 3.6
      autoscaling_config:
        min_replicas: 1
        max_replicas: 1
        # upscale_delay_s: 5
        # metrics_interval_s: 5
        # target_ongoing_requests: 16

spacy:
  # note that the spacy models have to be installed in the env to use it! (docker!)
  model_dir: ${oc.env:SPACY_MODELS_DIR, /spacy_models}
  models:
    en: en_core_web_trf-3.8.0
    de: de_core_news_lg-3.8.0
    it: it_core_news_lg-3.8.0
    default: en
  device: cuda # to run spaCy on the CPU, set device: cpu and remove gpu_memory_gb
  max_text_length: 2000000 # in characters (1000000 is spaCy default)
  # texts are processed in segments of at most this many characters, which bounds the GPU
  # memory: 50k segments need 1.8 GB more per replica and are only about 5% faster
  segment_length: 10000
  deployment:
    api:
      name: "spacy"
      num_replicas: 1
      max_ongoing_requests: 128
    model_worker:
      max_ongoing_requests: 64
      gpu_memory_gb: 2.7
      autoscaling_config:
        min_replicas: 1
        max_replicas: 4 # lowered to what fits on the GPU (gpu.fill_with)
        upscale_delay_s: 5
        metrics_interval_s: 5
        target_ongoing_requests: 1

# --- GPU Deployments (optional) ---

quote:
  model: "fynnos/quotect-mt5-base"
  max_length: 4096
  num_beams: 1
  device: cuda
  deployment:
    api:
      name: "quote"
      num_replicas: 1
      max_ongoing_requests: 128
    model_worker:
      max_ongoing_requests: 64
      gpu_memory_gb: 4.2
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1

coref:
  model_de: "fynnos/maverick-mes-de10"
  device: cuda
  deployment:
    api:
      name: "coref"
      num_replicas: 1
      max_ongoing_requests: 128
    model_worker:
      max_ongoing_requests: 64
      gpu_memory_gb: 5.8 # for documents of 10k characters, grows with the document length (#920)
      autoscaling_config:
        min_replicas: 0
        max_replicas: 1
