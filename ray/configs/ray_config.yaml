# --- GPU ---

gpu:
  # GPU memory in GB that Ray plans with; null uses the memory of the smallest GPU in
  # RAY_DEVICE_IDS. Set it lower if the GPU is shared with other services (e.g. vLLM).
  memory_gb: null
  # the deployment that gets as many replicas as fit next to all others at their max_replicas
  fill_with: spacy

# --- CPU Deployments ---

glotlid:
  model: "cis-lmu/glotlid"
  version: "latest"
  # the device is always CPU!
  deployment:
    api:
      name: "glotlid"
      num_replicas: 1
      max_ongoing_requests: 128
    model_worker:
      max_ongoing_requests: 64
      ray_actor_options:
        num_gpus: 0.0
      autoscaling_config:
        min_replicas: 1
        max_replicas: 32
        upscale_delay_s: 5
        metrics_interval_s: 5
        target_ongoing_requests: 1

# --- GPU Deployments (required) ---

whisper:
  model: deepdml/faster-whisper-large-v3-turbo-ct2
  device: cuda
  options:
    word_timestamps: True
    beam_size: 5
    best_of: 5
    batch_size: 8
  deployment:
    api:
      name: "whisper"
      num_replicas: 1
      max_ongoing_requests: 128
    model_worker:
      max_ongoing_requests: 64
      gpu_memory_gb: 4.2
      autoscaling_config:
        min_replicas: 1
        max_replicas: 1

detr:
  model: "facebook/detr-resnet-101"
  device: cuda
  deployment:
    api:
      name: "detr"
      num_replicas: 1
      max_ongoing_requests: 128
    model_worker:
      max_ongoing_requests: 64
      gpu_memory_gb: 1.5
      autoscaling_config:
        min_replicas: 1
        max_replicas: 1
  object_detection:
    confidence_threshold: 0.75
    coco2017_labels:
      # This has to be in order!!! (for object detection with DETR)
      - "background"
      - "person"
      - "bicycle"
      - "car"
      - "motorcycle"
      - "airplane"
