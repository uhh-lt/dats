# Runs the backend integration test suite and database migration checks.
# It runs for every push to main and for pull requests that can affect the backend.
name: backend checks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend_checks.yml"
      - "docker/**"
      - "tools/**"

jobs:
  backend-checks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Checkout PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ github.event.pull_request.number }}
      - name: Check for ray changes
        id: ray_changes
        uses: ./.github/actions/detect-changes
        with:
          path: ray
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
        with:
          backend: true
          ray: ${{ steps.ray_changes.outputs.has_changed }}
          hf_token: ${{ secrets.HF_HUB_TOKEN }}
      - name: Install backend dependencies
        run: just install backend
      - name: Build backend docker container
        working-directory: docker
        run: |
          source .env
          COMPOSE_PROFILES="rq,backend" docker compose build dats-backend-api
      - name: Start docker containers
        working-directory: docker
        run: |
          source .env
          if [ "${{ steps.ray_changes.outputs.has_changed }}" = "true" ]; then
            docker compose -f compose.ray.yml build
            docker compose -f compose.ray.yml up --wait
          fi
          COMPOSE_PROFILES="" docker compose up --wait --quiet-pull
      - name: Pytest runs without errors
        run: just test backend
      - name: Upload classifier metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classifier-metrics
          path: backend/test-results/*-classification.csv
          if-no-files-found: ignore
      - name: Database migrates without errors
        run: just alembic migrate
      - name: Database schema is up-to-date after migration
        run: just alembic check
      - name: Start remaining docker containers
        working-directory: docker
        run: |
          source .env
          COMPOSE_PROFILES="rq,backend" docker compose up --wait --quiet-pull
      - name: Test End-2-End importer script
        working-directory: backend
        env:
          TESTDATA_PASSWORD: ${{ secrets.TESTDATA_PASSWORD }}
        run: |
          source .venv/bin/activate
          cd ../tools/importer
          uv pip install -r requirements.txt
          wget -q http://ltdata1.informatik.uni-hamburg.de/dwts/totalitarismo.zip
          unzip -q -P "$TESTDATA_PASSWORD" totalitarismo.zip
          python dats_importer.py --input_dir json --backend_url http://localhost:13120/ --is_json --doctype text
          python dats_importer.py --input_dir images --backend_url http://localhost:13120/ --doctype image
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
        with:
          backend: true
          ray: ${{ steps.ray_changes.outputs.has_changed }}
