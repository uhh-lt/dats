name: agent-pr-documentation
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check for documentation impact"
        required: true
        type: number

permissions:
  contents: write # create the documentation branch and commit
  pull-requests: write # create the documentation PR

jobs:
  documentation:
    runs-on: self-hosted
    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_NUMBER="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER}}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number available." >&2
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/pull/${{ steps.pr.outputs.number }}/head

      - name: Run pr-documentation agent (headless)
        env:
          # GitHub auth for Copilot CLI and its built-in GitHub MCP server.
          # Uses the auto-generated GITHUB_TOKEN (scoped to this repo, expires after job).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Copilot CLI has a built-in GitHub MCP server whose default tools are
          # read-only. Enable only the additional tools required by this workflow:
          # https://github.com/github/github-mcp-server/blob/main/docs/installation-guides/install-copilot-cli.md
          # Available GitHub MCP toolsets:
          # https://github.com/github/github-mcp-server/blob/main/README.md#available-toolsets
          # Exact GitHub MCP tool definitions:
          # https://github.com/github/github-mcp-server/blob/main/README.md#tools
          #
          # --available-tools limits what the model can select.
          # --allow-tool grantspermission for each MCP call.
          # https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools#restricting-the-choice-of-tools-available-to-the-ai-model
          # https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools#allowing-or-denying-permission-for-specific-tools
          copilot -p "Check pull request #${{ steps.pr.outputs.number }} for documentation impact and create a docs PR if needed." \
            --agent pr-documentation \
            --add-github-mcp-tool='pull_request_read' \
            --add-github-mcp-tool='search_pull_requests' \
            --add-github-mcp-tool='create_branch' \
            --add-github-mcp-tool='push_files' \
            --add-github-mcp-tool='create_pull_request' \
            --add-github-mcp-tool='add_issue_comment' \
            --available-tools='view,github/*' \
            --allow-tool='github-mcp-server(pull_request_read)' \
            --allow-tool='github-mcp-server(search_pull_requests)' \
            --allow-tool='github-mcp-server(create_branch)' \
            --allow-tool='github-mcp-server(push_files)' \
            --allow-tool='github-mcp-server(create_pull_request)' \
            --allow-tool='github-mcp-server(add_issue_comment)'
