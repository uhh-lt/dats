# Runs the autonomous pr-reviewer agent on every PR that is opened or updated.
# The agent runs headlessly via the GitHub Copilot CLI on our self-hosted runners.
name: agent-review
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write # required to post review comments

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_NUMBER="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER}}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number available (neither pull_request event nor workflow_dispatch input)." >&2
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/pull/${{ steps.pr.outputs.number }}/head

      - name: Run pr-reviewer agent (headless)
        env:
          # GitHub auth for the Copilot CLI and for posting PR comments.
          # Uses the auto-generated GITHUB_TOKEN (scoped to this repo, expires after job).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Copilot CLI has a built-in GitHub MCP server whose default tools are
          # read-only. Enable only the additional tools required by this workflow:
          # https://github.com/github/github-mcp-server/blob/main/docs/installation-guides/install-copilot-cli.md
          # Available GitHub MCP toolsets:
          # https://github.com/github/github-mcp-server/blob/main/README.md#available-toolsets
          # Exact GitHub MCP tool definitions:
          # https://github.com/github/github-mcp-server/blob/main/README.md#tools
          #
          # --available-tools limits what the model can select. --allow-tool grants
          # permission for each MCP call so this headless job never waits for approval:
          # https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools#restricting-the-choice-of-tools-available-to-the-ai-model
          # https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools#allowing-or-denying-permission-for-specific-tools
          copilot -p "Review pull request #${{ steps.pr.outputs.number }}." \
            --agent pr-reviewer \
            --add-github-mcp-tool='get_me' \
            --add-github-mcp-tool='pull_request_read' \
            --add-github-mcp-tool='add_issue_comment' \
            --available-tools='read/readFile,github/get_me,github/pull_request_read,github/add_issue_comment' \
            --allow-tool='github(get_me)' \
            --allow-tool='github(pull_request_read)' \
            --allow-tool='github(add_issue_comment)'
