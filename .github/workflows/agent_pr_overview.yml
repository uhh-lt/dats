# Runs the autonomous PR Overview agent on every PR that is opened or updated.
# The agent runs headlessly via the GitHub Copilot CLI on our self-hosted runners.
name: agent-pr-overview
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to summarize"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write # required to update PR body or post comments

jobs:
  overview:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the agent reads full git history/diffs

      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_NUMBER="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER}}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number available (neither pull_request event nor workflow_dispatch input)." >&2
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ steps.pr.outputs.number }}

      - name: Run PR Overview agent (headless)
        env:
          # GitHub auth for the Copilot CLI and for posting PR comments.
          # Uses the auto-generated GITHUB_TOKEN (scoped to this repo, expires after job).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # All instructions live in .github/agents/pr-overview.agent.md;
          # the prompt only passes the per-run PR number.
          copilot -p "Generate an overview for pull request #${{ steps.pr.outputs.number }}." \
            --agent "PR Overview" \
            --allow-tool='github' \
            --allow-tool='read' \
            --allow-tool='shell' \
            --deny-tool='write'
