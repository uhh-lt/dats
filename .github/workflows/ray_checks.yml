# Builds and starts the Ray Docker stack to verify that the Ray service is healthy.
# It runs for every push to main and for pull requests that can affect Ray.
name: ray-checks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/ray_checks.yml"
      - "docker/**"
      - "ray/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ray-checks:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
        with:
          ray: true
          hf_token: ${{ secrets.HF_HUB_TOKEN }}
      - name: Build & Start Docker Containers
        working-directory: docker
        run: |
          source .env
          docker compose -f compose.ray.yml build
          docker compose -f compose.ray.yml up --wait
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
        with:
          ray: true
