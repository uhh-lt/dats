# Builds the application stack and verifies that the generated frontend API client is current.
# It runs for every push to main and for pull requests that can affect the frontend.
name: frontend checks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/frontend_checks.yml"
      - "docker/**"
      - "frontend/**"

jobs:
  frontend-checks:
    runs-on: self-hosted
    env:
      API_WORKERS: 1
      COMPOSE_PROFILES: "rq,backend,frontend"
    steps:
      - uses: actions/checkout@v7
      - name: Checkout PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ github.event.pull_request.number }}
      - name: Check for backend changes
        id: backend_changes
        uses: ./.github/actions/detect-changes
        with:
          path: backend
      - name: Check for ray changes
        id: ray_changes
        uses: ./.github/actions/detect-changes
        with:
          path: ray
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
        with:
          frontend: true
          backend: ${{ steps.backend_changes.outputs.has_changed }}
          ray: ${{ steps.ray_changes.outputs.has_changed }}
          hf_token: ${{ secrets.HF_HUB_TOKEN }}
      - name: Build frontend docker container
        working-directory: docker
        run: |
          source .env
          COMPOSE_PROFILES="rq,backend,frontend" docker compose build dats-frontend
      - name: Start docker containers
        working-directory: docker
        run: |
          source .env
          if [ "${{ steps.ray_changes.outputs.has_changed }}" = "true" ]; then
            docker compose -f compose.ray.yml build
            docker compose -f compose.ray.yml up --wait
          fi
          if [ "${{ steps.backend_changes.outputs.has_changed }}" = "true" ]; then
            COMPOSE_PROFILES="rq,backend,frontend" docker compose build dats-backend-api
          fi
          COMPOSE_PROFILES="rq,backend,frontend" docker compose up --wait --quiet-pull
      - name: Install Frontend dependencies
        run: just install frontend
      - name: Check API client is up-to-date
        run: just update-api
      - name: Add and commit changes
        uses: EndBug/add-and-commit@v10.0.0
        if: github.event_name == 'pull_request'
        with:
          add: |
            frontend/src/api
            frontend/src/models
          message: "Update OpenAPI spec and client"
          pathspec_error_handling: exitImmediately
          default_author: github_actions
      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
        with:
          frontend: true
          backend: ${{ steps.backend_changes.outputs.has_changed }}
          ray: ${{ steps.ray_changes.outputs.has_changed }}
