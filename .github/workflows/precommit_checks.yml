# Runs all repository-wide pre-commit formatting, linting, and static-analysis checks.
# It runs for every pull request and every push to main.
name: precommit checks
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  precommit-checks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Install Frontend Dependencies
        run: just install frontend
      - name: Install Backend Dependencies
        run: just install backend
      - name: Install Ray Dependencies
        run: just install ray
      - name: Run pre-commit
        run: |
          uv tool install pre-commit
          just precommit
