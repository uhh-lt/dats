name: prepare-env
description: >-
  Shared CI environment bootstrap: create folders, generate .env files,
  pin GPU, and — for each enabled component — bump its docker image version
  for this run. When backend or frontend is enabled, also point at the hosted
  services and inject the Hugging Face token. When ray is enabled, set up its cache.
inputs:
  backend:
    description: '"true" if the backend component is part of this run.'
    required: false
    default: "false"
  frontend:
    description: '"true" if the frontend component is part of this run.'
    required: false
    default: "false"
  ray:
    description: '"true" if the ray component is part of this run.'
    required: false
    default: "false"
  hf_token:
    description: "Hugging Face hub token."
    required: true
runs:
  using: composite
  steps:
    - name: Prepare environment
      shell: bash
      env:
        HF_HUB_TOKEN: ${{ inputs.hf_token }}
        BACKEND: ${{ inputs.backend }}
        FRONTEND: ${{ inputs.frontend }}
        RAY: ${{ inputs.ray }}
      run: |
        set -euo pipefail
        ./bin/setup/setup-folders.sh --development

        # Derive a per-runner identity so multiple runners can share this machine:
        # runner names end in two digits (e.g. dats-runner-01), which become the
        # port prefix (501) and suffix the compose project name. This isolates
        # ports, containers, networks, and named volumes between runners.
        RUNNER_INDEX="$(echo "${RUNNER_NAME}" | grep -oE '[0-9]{2}$' || true)"
        if [ -z "${RUNNER_INDEX}" ]; then
          echo "Runner name '${RUNNER_NAME}' must end in two digits (e.g. dats-runner-01)." >&2
          exit 1
        fi
        PORT_PREFIX="5${RUNNER_INDEX}"
        # Compose project names must match [a-z0-9_-]; sanitize the runner name.
        SAFE_RUNNER_NAME="$(printf '%s' "${RUNNER_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '-')"
        ./bin/setup/setup-envs.sh --project_name "action-runner-${SAFE_RUNNER_NAME}" --port_prefix "${PORT_PREFIX}"

        # Bump the image version of every enabled component for this run.
        if [ "${BACKEND}" = "true" ]; then
          sed -i 's/\(DATS_BACKEND_DOCKER_VERSION=[0-9.]*\)/\1-${{ github.run_id }}/' docker/.env
        fi
        if [ "${FRONTEND}" = "true" ]; then
          sed -i 's/\(DATS_FRONTEND_DOCKER_VERSION=[0-9.]*\)/\1-${{ github.run_id }}/' docker/.env
        fi
        if [ "${RAY}" = "true" ]; then
          sed -i 's/\(DATS_RAY_DOCKER_VERSION=[0-9.]*\)/\1-${{ github.run_id }}/' docker/.env
        fi

        # Connect to the hosted services.
        sed -i 's/^LLM_PROVIDER_HOST=.*/LLM_PROVIDER_HOST=ltdwise.informatik.uni-hamburg.de/' backend/.env docker/.env
        sed -i 's/^LLM_PROVIDER_PORT=.*/LLM_PROVIDER_PORT=10133/' backend/.env docker/.env
        sed -i 's/^EMB_PROVIDER_HOST=.*/EMB_PROVIDER_HOST=ltdwise.informatik.uni-hamburg.de/' backend/.env docker/.env
        sed -i 's/^EMB_PROVIDER_PORT=.*/EMB_PROVIDER_PORT=10137/' backend/.env docker/.env
        sed -i 's/^RAY_HOST=.*/RAY_HOST=ltdwise.informatik.uni-hamburg.de/' backend/.env docker/.env
        sed -i 's/^RAY_PORT=.*/RAY_PORT=10130/' backend/.env docker/.env
        sed -i 's/^DOCLING_HOST=.*/DOCLING_HOST=ltdwise.informatik.uni-hamburg.de/' backend/.env docker/.env
        sed -i 's/^DOCLING_PORT=.*/DOCLING_PORT=10139/' backend/.env docker/.env

        # Configure secrets.
        sed -i "s|^HF_HUB_TOKEN=.*|HF_HUB_TOKEN=${HF_HUB_TOKEN}|" docker/.env
        sed -i "s|^API_HF_HUB_TOKEN=.*|API_HF_HUB_TOKEN=${HF_HUB_TOKEN}|" backend/.env

        # Set up Ray locally, when its part of this run.
        if [ "${RAY}" = "true" ]; then
          sed -i "s/^RAY_PORT=.*/RAY_PORT=${PORT_PREFIX}30/" backend/.env docker/.env
        fi
