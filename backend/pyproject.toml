[project]
name = "dats-backend"
authors = [
  {name = "Tim Fischer", email = "tim.fischer@uni-hamburg.de"},
  {name = "Florian Schneider", email = "florian.schneider-1@uni-hamburg.de"},
  {name = "Fynn Petersen-Frey", email = "fynn.petersen-frey@uni-hamburg.de"},
  {name = "Chris Biemann", email = "chris.biemann@uni-hamburg.de"},
]
maintainers = [
  {name = "Tim Fischer", email = "tim.fischer@uni-hamburg.de"},
]
version = "1.10.1"
requires-python = "==3.11.*"
description = "DATS is a machine-learning powered web application for multi-modal discourse analysis. It provides tools for the typical workflow of a discsourse analysis project including data collection, data management, exploration, annotation, qualitative & quantitative analysis, interpratation and reflection."
readme = "../README.md"
license="Apache-2.0"
license-files = ["../LICENSE"]
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "blinker>=1.9.0",
    "datasets>=5.0.0",
    "elasticsearch==7.17",
    "email-validator>=2.3.0",
    "evaluate>=0.4.6",
    "fastapi>=0.139.0",
    "fastapi-mail>=1.6.5",
    "ffmpeg-python>=0.2.0",
    "hdbscan>=0.8.44",
    "itsdangerous>=2.2.0",
    "lightning>=2.6.5",
    "litellm>=1.90.3",
    "loguru>=0.7.3",
    "lxml-html-clean>=0.4.5",
    "mammoth>=1.12.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "omegaconf>=2.3.1",
    "openai>=2.44.0",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "pytorch-crf>=0.7.2",
    "readability-lxml>=0.8.4.1",
    "redis>=8.0.1",
    "rq>=2.10.0",
    "scikit-learn>=1.9.0",
    "scrapy>=2.16.0",
    "sentence-transformers>=5.6.0",
    "sentry_sdk>=2.63.0",
    "seqeval>=1.2.2",
    "setfit==1.1.3",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
    "srsly>=2.5.3",
    "torch>=2.12.1",
    "transformers<5.0.0",
    "tqdm>=4.68.3",
    "umap-learn>=0.5.12",
    "uvicorn>=0.50.0",
    "weaviate-client>=4.22.0",
    "yake>=0.7.3",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "ruff>=0.15.20",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-order>=1.5.0",
]

[project.urls]
Homepage = "https://www.hcds.uni-hamburg.de/de/research/demos/dats.html"
Documentation = "https://github.com/uhh-lt/dats/wiki"
Repository = "https://github.com/uhh-lt/dats.git"
Issues = "https://github.com/uhh-lt/dats/issues"

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = [
    "common",
    "core",
    "config",
    "config_schema",
    "main",
    "migrations",
    "modules",
    "preprocessing",
    "ray_model_worker",
    "repos",
    "systems",
    "utils"
]

[tool.pyright]
include = ["src", "test"]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "**/.venv",
    "src/dev_notebooks",
    "**/node_modules",
    "**/.*"
]
extraPaths = ["src"]
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportUnreachable = true

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
    "-ra -q",
]
testpaths = [
    "test"
]
