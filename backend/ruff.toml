# The only ruff config of this component (editors and `just lint` both use it).
# Every top-level module in `src` and `test` is first-party for the import sorting.
src = ["src", "test"]

[lint]
# I: isort-compatible import sorting
# W291: Trailing whitespace
# W292: Add newline to end of file
# W293: Blank line contains whitespace
extend-select = ["I", "W292", "W291", "W293"]
