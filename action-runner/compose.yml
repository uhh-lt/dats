x-runner-common: &runner-base
  build: .
  network_mode: "host"
  environment: &runner-base-env
    GITHUB_OWNER: ${GITHUB_OWNER:?GITHUB_OWNER is missing - copy .env.example to .env and set it}
    GITHUB_REPO: ${GITHUB_REPO:?GITHUB_REPO is missing - copy .env.example to .env and set it}
    GITHUB_PAT: ${GITHUB_PAT:?GITHUB_PAT is missing - copy .env.example to .env and set it}
    RAY_CACHE_HOST_DIR: ${RAY_CACHE_HOST_DIR:?RAY_CACHE_HOST_DIR is missing - copy .env.example to .env and set it}
    # uv cache in the runner's own _work mount, so uv sync hardlinks it into the checkouts
    UV_CACHE_DIR: /actions-runner/_work/.cache/uv
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "pgrep", "-f", "Runner.Listener"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  deploy:
    resources:
      reservations:
        devices:
          # CDI keeps the GPU after a `systemctl daemon-reload` (see docker/compose.yml)
          - driver: cdi
            device_ids: ["nvidia.com/gpu=${RUNNER_GPU_DEVICE_ID:-0}"]
            capabilities: [gpu]

services:
  runner-01:
    <<: *runner-base
    hostname: dats-runner-01
    environment:
      <<: *runner-base-env
      HOST_WORK_DIR: ${RUNNER_WORK_BASE_DIR:?}/runner-01
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_WORK_BASE_DIR:?RUNNER_WORK_BASE_DIR is missing}/runner-01:/actions-runner/_work
  runner-02:
    <<: *runner-base
    hostname: dats-runner-02
    environment:
      <<: *runner-base-env
      HOST_WORK_DIR: ${RUNNER_WORK_BASE_DIR:?}/runner-02
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_WORK_BASE_DIR:?RUNNER_WORK_BASE_DIR is missing}/runner-02:/actions-runner/_work
  runner-03:
    <<: *runner-base
    hostname: dats-runner-03
    environment:
      <<: *runner-base-env
      HOST_WORK_DIR: ${RUNNER_WORK_BASE_DIR:?}/runner-03
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_WORK_BASE_DIR:?RUNNER_WORK_BASE_DIR is missing}/runner-03:/actions-runner/_work
  runner-04:
    <<: *runner-base
    hostname: dats-runner-04
    environment:
      <<: *runner-base-env
      HOST_WORK_DIR: ${RUNNER_WORK_BASE_DIR:?}/runner-04
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_WORK_BASE_DIR:?RUNNER_WORK_BASE_DIR is missing}/runner-04:/actions-runner/_work
