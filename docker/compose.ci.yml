# CI overrides for compose.yml and compose.override.yml, enabled by the
# prepare-env action (.github/actions/prepare-env) through COMPOSE_FILE.
# The data services keep their data in memory: a CI run throws it away in the
# cleanup (`docker compose down -v`).
services:
  postgres:
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 8g

  redis:
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          size: 1g

  weaviate:
    volumes:
      - type: tmpfs
        target: /var/lib/weaviate
        tmpfs:
          size: 8g

  elasticsearch:
    volumes:
      - type: tmpfs
        target: /usr/share/elasticsearch/data
        tmpfs:
          size: 8g
          # elasticsearch runs as DOCKER_UID, which must be able to write here
          mode: 01777
