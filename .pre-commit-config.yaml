# Hooks are grouped by task and run in this order:
#   1. format      (fix code style first, so lint/typecheck see final code)
#   2. lint        (catch bugs/style after formatting)
#   3. typecheck   (whole-project; slowest, runs last)
#   4. everything else (generic file hygiene, shell formatting)
repos:
  # --- 1. Format -------------------------------------------------------------
  - repo: local
    hooks:
      - id: format-backend
        name: "Format: Backend"
        entry: bash -c 'just format backend "$@"' --
        language: system
        files: ^backend/.*\.py$
      - id: format-ray
        name: "Format: Ray"
        entry: bash -c 'just format ray "$@"' --
        language: system
        files: ^ray/.*\.py$
      - id: format-frontend
        name: "Format: Frontend"
        entry: bash -c 'just format frontend "$@"' --
        language: system
        files: ^frontend/.*\.([jt]sx?|json|ya?ml)$
      - id: format-repo
        name: "Format: Repo"
        entry: bash -c 'just format repo "$@"' --
        language: system
        # repo-wide prettier for files NOT already handled by a component hook
        files: \.([jt]sx?|json|ya?ml|md|css|html)$
        exclude: ^(frontend|backend|ray)/

  # --- 2. Lint ---------------------------------------------------------------
  - repo: local
    hooks:
      - id: lint-backend
        name: "Lint: Backend"
        entry: bash -c 'just lint backend "$@"' --
        language: system
        files: ^backend/.*\.py$
      - id: lint-ray
        name: "Lint: Ray"
        entry: bash -c 'just lint ray "$@"' --
        language: system
        files: ^ray/.*\.py$
      - id: lint-frontend
        name: "Lint: Frontend"
        entry: bash -c 'just lint frontend "$@"' --
        language: system
        files: ^frontend/.*\.[jt]sx?$ # *.js, *.jsx, *.ts and *.tsx

  # --- 3. Typecheck (whole-project: single-file analysis gives misleading errors) ---
  - repo: local
    hooks:
      - id: typecheck-backend
        name: "Typecheck: Backend"
        entry: bash -c 'just typecheck backend' --
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: typecheck-ray
        name: "Typecheck: Ray"
        entry: bash -c 'just typecheck ray' --
        language: system
        pass_filenames: false
        files: ^ray/.*\.py$
      - id: typecheck-frontend
        name: "Typecheck: Frontend"
        entry: bash -c 'just typecheck frontend' --
        language: system
        pass_filenames: false
        files: ^frontend/.*\.[jt]sx?$ # *.js, *.jsx, *.ts and *.tsx

  # --- 4. Everything else ------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

exclude: ^tools/
